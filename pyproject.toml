[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tensorversehub"
version = "2.0.0"
description = "Production utilities and a 27-notebook curriculum for TensorFlow 2.16+ / Keras 3"
readme = { file = "README.md", content-type = "text/markdown" }
license = { file = "LICENSE" }
authors = [{ name = "Satvik Praveen", email = "satvikpraveen707@gmail.com" }]
keywords = [
  "tensorflow", "keras", "machine-learning", "deep-learning", "computer-vision",
  "nlp", "generative-models", "model-optimization", "tflite", "onnx",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
requires-python = ">=3.10"

dependencies = [
  "tensorflow>=2.16,<2.22",
  "numpy>=1.26",
  "matplotlib>=3.7",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
# Legacy Keras 2 stack required by tensorflow-model-optimization (pruning / QAT).
optimization = ["tensorflow-model-optimization>=0.8.0", "tf-keras>=2.16"]
export = ["tf2onnx>=1.16", "onnx>=1.15", "onnxruntime>=1.17"]
serving = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "flask>=3.0", "streamlit>=1.32"]
notebooks = [
  "jupyterlab>=4.0", "ipywidgets>=8.0", "pandas>=2.0", "seaborn>=0.13", "pillow>=10.0",
  "tqdm>=4.66", "tensorflow-datasets>=4.9", "tensorflow-hub>=0.16", "keras-tuner>=1.4",
]
dev = [
  "pytest>=8.0", "pytest-cov>=5.0", "pytest-xdist>=3.5", "ruff>=0.6", "mypy>=1.10",
  "pre-commit>=3.7", "nbformat>=5.10", "build>=1.2", "twine>=5.0", "httpx>=0.27",
]
docs = ["mkdocs>=1.6", "mkdocs-material>=9.5", "mkdocstrings[python]>=0.25"]
all = ["tensorversehub[optimization,export,serving,notebooks,dev,docs]"]

[project.urls]
Homepage = "https://github.com/SatvikPraveen/TensorVerseHub"
Documentation = "https://satvikpraveen.github.io/TensorVerseHub"
"Source Code" = "https://github.com/SatvikPraveen/TensorVerseHub"
"Bug Tracker" = "https://github.com/SatvikPraveen/TensorVerseHub/issues"
Changelog = "https://github.com/SatvikPraveen/TensorVerseHub/blob/main/docs/CHANGELOG.md"

[project.scripts]
tensorverse = "tensorversehub.cli:main"
tensorverse-train = "tensorversehub.cli.train:main"
tensorverse-evaluate = "tensorversehub.cli.evaluate:main"
tensorverse-convert = "tensorversehub.cli.convert:main"
tensorverse-serve = "tensorversehub.cli.serve:main"

# ── setuptools ────────────────────────────────────────────────
[tool.setuptools.packages.find]
where = ["."]
include = ["tensorversehub*"]

[tool.setuptools.package-data]
tensorversehub = ["py.typed"]

# ── Ruff (lint + format) ──────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["notebooks", "build", "dist", "site"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "PIE"]
ignore = [
  "E501",   # line length is handled by the formatter
  "N802", "N803", "N806", "N812",  # ML naming conventions (X, y, d_model, ...)
  "B008",   # function calls in argument defaults (tf.TensorSpec etc.)
  "B905",   # zip(strict=) not needed
  "RUF012", # mutable class attributes
  "SIM108", # ternary is not always clearer
  "UP007", "UP006", "UP035", "UP045",  # keep typing.* for readability with TF
  "E731",   # lambda assignments
  "RUF001", "RUF002", "RUF003",  # intentional typography (→, —, ·) in docstrings
  "RUF005", "RUF013", "RUF015", "RUF022", "RUF059",
  "N999", "E741", "SIM102", "SIM117", "B006", "B007", "B023", "B028", "B904", "PIE808", "UP008", "UP015", "UP028", "F841", "E402", "SIM115", "N818", "N803", "E722",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "B011", "F841"]
"examples/*" = ["E402", "F401", "B", "SIM", "N", "UP", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["tensorversehub"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

# ── mypy ──────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"  # numpy 2.x stubs use PEP 695 syntax; runtime floor stays 3.10
packages = ["tensorversehub"]
ignore_missing_imports = true
no_strict_optional = true
warn_unused_ignores = false
warn_redundant_casts = true
check_untyped_defs = true
exclude = ["build/", "dist/", "examples/", "notebooks/"]

# ── pytest ────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["-ra", "--strict-markers", "--tb=short", "-p", "no:cacheprovider"]
markers = [
  "slow: long-running tests (deselect with -m 'not slow')",
  "gpu: requires a GPU",
  "integration: end-to-end tests",
  "legacy_keras: requires TF_USE_LEGACY_KERAS=1 and tensorflow-model-optimization",
  "keras3: requires Keras 3",
]
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::UserWarning",
  "ignore::FutureWarning",
]

# ── coverage ──────────────────────────────────────────────────
[tool.coverage.run]
source = ["tensorversehub"]
omit = ["tensorversehub/cli/serve.py"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError", "if __name__ == .__main__.:"]
show_missing = true
skip_covered = false
