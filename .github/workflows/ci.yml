# ============================================================
# TensorVerseHub — CI
# lint/type-check → unit tests (TF/Keras matrix) → notebooks → docs → docker
# ============================================================
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TF_CPP_MIN_LOG_LEVEL: "3"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install tooling
        run: python -m pip install --upgrade pip ruff mypy
      - name: Ruff lint
        run: ruff check tensorversehub tests examples
      - name: Ruff format
        run: ruff format --check tensorversehub tests
      - name: Install package for mypy
        run: pip install -e . --no-deps "numpy>=1.26"
      - name: mypy
        run: mypy tensorversehub

  test:
    name: Tests (py${{ matrix.python }} · TF ${{ matrix.tensorflow }}${{ matrix.legacy-keras == '1' && ' · legacy Keras' || '' }})
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10"
            tensorflow: "2.17.1"
            legacy-keras: "0"
            # TF 2.17 pins ml_dtypes < 0.5; newer Keras and onnx need ml_dtypes >= 0.5
            constraints: "keras>=3.2,<3.9 onnx<1.18"
          - python: "3.11"
            tensorflow: "2.18.1"
            legacy-keras: "0"
          - python: "3.12"
            tensorflow: "2.21.0"
            legacy-keras: "0"
            coverage: "1"
          - python: "3.12"
            tensorflow: "2.21.0"
            legacy-keras: "1"
    env:
      TF_USE_LEGACY_KERAS: ${{ matrix.legacy-keras }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # Pin TensorFlow through a constraints file so the package's
          # 'tensorflow>=2.17' requirement cannot pull a second, newer wheel
          # on top of the matrix version (mixed binaries -> undefined symbols).
          echo "tensorflow==${{ matrix.tensorflow }}" > /tmp/constraints.txt
          echo "${{ matrix.constraints }}" | tr ' ' '\n' >> /tmp/constraints.txt
          cat /tmp/constraints.txt
          pip install -c /tmp/constraints.txt "tensorflow==${{ matrix.tensorflow }}"
          pip install -c /tmp/constraints.txt -e ".[dev,export]" fastapi httpx
          if [ "${{ matrix.legacy-keras }}" = "1" ]; then pip install -c /tmp/constraints.txt -e ".[optimization]"; fi
          pip check || true
          python -c "import tensorversehub as tvh, json; print(json.dumps(tvh.about(), indent=1))"
      - name: Run tests
        run: |
          EXTRA=""
          if [ "${{ matrix.coverage }}" = "1" ]; then EXTRA="--cov=tensorversehub --cov-report=xml --cov-report=term-missing"; fi
          pytest tests -m "not slow and not gpu" $EXTRA
      - name: Upload coverage
        if: matrix.coverage == '1'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false

  notebooks:
    name: Notebook validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install nbformat
      - name: Validate notebooks
        run: |
          python - <<'PY'
          import nbformat, pathlib, sys
          errors = []
          paths = sorted(pathlib.Path("notebooks").rglob("*.ipynb"))
          for nb in paths:
              try:
                  nbformat.validate(nbformat.read(nb, as_version=4))
              except Exception as exc:
                  errors.append(f"{nb}: {exc}")
          print(f"{len(paths)} notebooks checked, {len(errors)} errors")
          for err in errors:
              print("ERROR", err)
          sys.exit(1 if errors else 0)
          PY

  docs:
    name: Docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[docs]"
      - run: mkdocs build --strict

  build:
    name: Package build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: Smoke-install wheel
        run: |
          pip install dist/*.whl --no-deps
          python -c "import importlib.metadata as m; print(m.version('tensorversehub'))"

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: tensorversehub:ci
