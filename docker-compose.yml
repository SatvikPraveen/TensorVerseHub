# ============================================================
# TensorVerseHub — services
#   docker compose up -d jupyter      → http://localhost:8888
#   docker compose up -d              → all services
# ============================================================
x-common-env: &common-env
  TF_CPP_MIN_LOG_LEVEL: "2"
  PYTHONUNBUFFERED: "1"

services:
  jupyter:
    build: { context: ., target: jupyter }
    image: tensorversehub:jupyter
    container_name: tensorversehub-jupyter
    ports: ["8888:8888"]
    environment: { <<: *common-env }
    volumes:
      - ./notebooks:/app/notebooks
      - ./examples:/app/examples
      - ./docs:/app/docs
      - models:/app/models
      - data:/app/data
    restart: unless-stopped

  api:
    build: { context: ., target: api }
    image: tensorversehub:api
    container_name: tensorversehub-api
    ports: ["8000:8000"]
    environment:
      <<: *common-env
      TVH_MODEL: /app/models/final_model.keras
    volumes:
      - models:/app/models
    restart: unless-stopped

  streamlit:
    build: { context: ., target: jupyter }
    image: tensorversehub:jupyter
    container_name: tensorversehub-streamlit
    command: >
      streamlit run examples/serving_examples/streamlit_tensorflow_demo.py
      --server.port=8501 --server.address=0.0.0.0 --server.headless=true
    ports: ["8501:8501"]
    environment: { <<: *common-env }
    volumes:
      - ./examples:/app/examples
      - models:/app/models
    restart: unless-stopped

  tensorboard:
    build: { context: ., target: runtime }
    image: tensorversehub:runtime
    container_name: tensorversehub-tensorboard
    command: tensorboard --logdir=/app/logs --host=0.0.0.0 --port=6006
    ports: ["6006:6006"]
    environment: { <<: *common-env }
    volumes:
      - logs:/app/logs
    restart: unless-stopped

volumes:
  models:
  data:
  logs:
